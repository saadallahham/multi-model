name: Run five-well experiment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate data, train models, and render figures
        run: python run_experiment.py
      - name: Apply saved models to application logs
        run: python apply_models.py
      - name: Run unit and result verification tests
        run: python -m unittest discover -s tests -v
      - name: Save results and figures
        uses: actions/upload-artifact@v4
        with:
          name: five-well-results-${{ matrix.os }}
          path: outputs/
          if-no-files-found: error
          retention-days: 14
